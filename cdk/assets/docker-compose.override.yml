# cdk/assets/docker-compose.override.yml
# Overlay on the pinned Supabase bundle's docker-compose.yml.
# VERIFY every key against the pinned tag's .env.example (§5, §10).
services:
  db:
    # Bind Postgres' data dir onto the dedicated, encrypted, deleteOnTermination:false
    # EBS data volume (mounted by bootstrap.sh at /mnt/pgdata). The upstream bundle
    # defaults to `./volumes/db/data:/var/lib/postgresql/data` — i.e. the ROOT volume
    # under APP_DIR — which would put ALL Postgres state (PHI) on the ephemeral root
    # volume and destroy it on any instance replacement (§7 data-loss trap). Compose
    # merges volume mounts by container target, so this replaces the bundle's bind.
    # pg_wal lives inside PGDATA, so it lands on the SAME data volume (§7 snapshot
    # coherence). pg1-path in pgbackrest.conf points at /mnt/pgdata/db/data to match.
    volumes:
      - /mnt/pgdata/db/data:/var/lib/postgresql/data:Z

  studio:
    # Studio reachable on :3000 (ALB targets this; SG allows :3000 from ALB only).
    ports:
      - "3000:3000"
    # If the pinned tag declares `depends_on: analytics`, null it out so the front
    # door does not hang on analytics health at boot. (W6 correction: the pinned tag
    # runs analytics/vector by default and they ARE up on the live host — the nulled
    # depends_on stays anyway so a wedged analytics can never hold studio/kong down.)
    depends_on: {}

  kong:
    # Proxy :8000 stays reachable (SG-gated from internal clients). Kong Admin
    # (:8001/:8444) and Manager (:8002) bind to loopback ONLY — never in any SG/ALB
    # target (§6, §11). Verified unreachable in §17.
    ports:
      - "8000:8000/tcp"
      - "127.0.0.1:8001:8001/tcp"
      - "127.0.0.1:8444:8444/tcp"
      - "127.0.0.1:8002:8002/tcp"
    depends_on: {}
    # nsight-w6 analytics route: mount the vendored kong config (bundle kong.yml with
    # ONLY the analytics-v1-api route uncommented; staged by cdk to the non-bundle
    # path /opt/supabase/kong-nsight.yml) over the container's template target.
    # Compose merges volume mounts by container target — same precedent as the db
    # data-dir bind above — so this replaces the bundle's ./volumes/api/kong.yml
    # mount at /home/kong/temp.yml while fetch_bundle's cp -a can never clobber it.
    volumes:
      - /opt/supabase/kong-nsight.yml:/home/kong/temp.yml:ro,z

  rest:
    # PostgREST only serves schemas listed in PGRST_DB_SCHEMAS. The pinned bundle
    # defaults to `public, storage, graphql_public`, which does NOT include the
    # app's `marketinghub` schema — so every service_role query the Next.js server
    # issues via `.schema('marketinghub')` (Accept-Profile: marketinghub) would fail
    # with PGRST106 ("The schema must be one of the following: ..."). Expose it here.
    # Keep the bundle defaults and APPEND app schemas (never drop public/storage).
    # Wave 8 appends:
    #   * competitor_intel — the intel module's tables + the match_chunks RPC
    #     (RLS FORCE + authenticated grants; anon has no schema USAGE).
    #   * pgmq_public — SECURITY DEFINER queue wrappers so the worker consumes
    #     'ci_embed' via .schema('pgmq_public').rpc(...). Safe to expose: the
    #     schema holds functions only (no tables); anon/authenticated hold no
    #     schema USAGE, and the W8 migration revokes the Postgres-DEFAULT
    #     PUBLIC EXECUTE that Wave 1 never removed (Wave 1 only ADDED a
    #     service_role grant), leaving service_role the sole grantee — so
    #     anon/authenticated get PGRST 42501 denials from two independent
    #     layers. NEVER `grant usage on schema pgmq_public` to user roles
    #     (upstream's client-side-queues recipe): the wrappers run SECURITY
    #     DEFINER over EVERY pgmq queue in the database.
    # Host apply for a RUNNING instance: /tmp/stage-w8-env.sh (recreates rest).
    environment:
      PGRST_DB_SCHEMAS: "public, storage, graphql_public, marketinghub, competitor_intel, pgmq_public"

  storage:
    # S3 backend against the dedicated, bucket-scoped bucket. Creds are injected via
    # the env-file ONLY for this service (render-env.sh), never the instance role.
    environment:
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_FORCE_PATH_STYLE: "false"     # real S3, not MinIO
      AWS_ACCESS_KEY_ID: ${STORAGE_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${STORAGE_S3_REGION}
      # NOTE: omit STORAGE_S3_ENDPOINT entirely for real S3 (§10).

  functions:
    # Edge Functions dir lives on the persistent data volume (§7).
    volumes:
      - /mnt/pgdata/functions:/home/deno/functions:rw

  supavisor:
    # The pooler entrypoint (limits.sh) raises RLIMIT_NOFILE to 100000, but the
    # container's default hard nofile limit is lower, so `ulimit -n 100000` fails
    # ("Operation not permitted") and the container crash-loops (exit 1). Grant an
    # explicit high nofile limit so the entrypoint succeeds. (Pooler is off the app's
    # PostgREST path, but keep it healthy.)
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
